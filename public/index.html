<!doctype html>
<html lang="de">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <title>User Management | SaS2</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>User Management TEST</h1>
            <p>Database: SaS2 | Table: dbo.vfxusr</p>
        </div>
        
        <div class="content">
            <div class="search-controls">
                <div class="search-container">
                    <input type="text" class="search-box" id="searchBox" placeholder="Benutzer suchen...">
                    <button class="refresh-btn" onclick="fetchUsers()">
                        Aktualisieren
                    </button>
                    <!-- <button class="add-btn" onclick="showAddForm()">Benutzer hinzufügen</button> -->
                </div>
                
                <div class="stats">
                    <div class="user-count" id="userCount">Lade Daten...</div>
                </div>
            </div>

            <div class="add-form" id="addForm" style="display: none;">
                <div class="form-container">
                    <h3>Neuen Benutzer hinzufügen</h3>
                    <form id="userForm">
                        <div class="form-group">
                            <label for="userName">Benutzername:</label>
                            <input type="text" id="userName" name="user_name" required>
                        </div>
                        <div class="form-group">
                            <label for="userAccess">Zugriffslevel:</label>
                            <input type="number" id="userAccess" name="useraccess" required min="0">
                        </div>
                        <div class="form-buttons">
                            <button type="submit" class="save-btn">Speichern</button>
                            <button type="button" class="cancel-btn" onclick="hideAddForm()">Abbrechen</button>
                        </div>
                    </form>
                </div>
            </div>
            
            <div class="table-wrapper">
                <div id="app">
                    <div class="loading">
                        <div class="spinner"></div>
                        Lade Benutzerdaten...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
