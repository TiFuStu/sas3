<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SaS3 - Übersicht | LBM Rheinland-Pfalz</title>
  <link rel="stylesheet" href="src/lbm.css">
  <style>
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .filters {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .filter-btn {
      background-color: var(--lbm-gray-light);
      border: 1px solid var(--lbm-gray);
      padding: 0.5rem 1rem;
      border-radius: var(--border-radius);
      cursor: pointer;
      transition: var(--transition);
    }

    .filter-btn.active {
      background-color: var(--lbm-blue);
      color: var(--lbm-white);
      border-color: var(--lbm-blue);
    }

    .cases-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--lbm-white);
      box-shadow: var(--box-shadow);
      border-radius: var(--border-radius);
      overflow: hidden;
    }

    .cases-table th,
    .cases-table td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid var(--lbm-gray-light);
    }

    .cases-table th {
      background-color: var(--lbm-gray-light);
      font-weight: bold;
      color: var(--lbm-text);
    }

    .cases-table tr:hover {
      background-color: #fcfcfc;
    }

    .status-badge {
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .status-neu {
      background-color: #e3f2fd;
      color: #1976d2;
    }

    .status-bearbeitung {
      background-color: #fff3e0;
      color: #f57c00;
    }

    .status-abgeschlossen {
      background-color: #e8f5e9;
      color: #388e3c;
    }

    #admin-link-users {
      display: none;
    }

    #admin-link-db-config {
      display: none;
    }

    #admin-link-insurance-catalog {
      display: none;
    }

    #admin-link-cash-desk-catalog {
      display: none;
    }

    #admin-link-catalog {
      display: none;
    }
  </style>
</head>

<body>
  <header>
    <div class="logo-container">
      <img src="src/lbm.png" alt="LBM Logo">
      <span class="header-title">SaS3 - Schadensabwicklungssystem</span>
    </div>
    <div class="user-menu">
      <span class="user-info" id="user-name"></span>
      <a href="/logout" class="logout-btn">Abmelden</a>
    </div>
  </header>

  <div class="container">
    <div class="dashboard-header">
      <h1>Fälle Übersicht</h1>
      <div style="display: flex; gap: 1rem;">
        <a href="/rights" class="btn btn-secondary" id="admin-link-users">Rechteverwaltung</a>
        <a href="/db-config" class="btn btn-secondary" id="admin-link-db-config">Datenbank-Konfiguration</a>
        <a href="/catalog" class="btn btn-secondary" id="admin-link-catalog">Kosten-Katalog</a>
        <a href="/insurance-catalog" class="btn btn-secondary" id="admin-link-insurance-catalog">Versicherungs-Katalog</a>
        <a href="/cash-desk-catalog" class="btn btn-secondary" id="admin-link-cash-desk-catalog">Kassen-Katalog</a>
        <a href="/create-damage-case" class="btn btn-primary" id="create-case-btn" style="display: none;">Neuer Fall</a>
      </div>
    </div>

    <div class="card">
      <div class="filters" id="scope-filters">
        <button class="filter-btn active" data-scope="own">Meine Fälle</button>
        <button class="filter-btn" data-scope="department" id="filter-dept" style="display: none;">Meine
          Dienststelle</button>
        <button class="filter-btn" data-scope="all" id="filter-all" style="display: none;">Alle Fälle</button>
      </div>

      <table class="cases-table">
        <thead>
          <tr>
            <th>Fallnummer</th>
            <th>Betreff</th>
            <th>Dienststelle</th>
            <th>Ersteller</th>
            <th>Datum</th>
            <th>Status</th>
            <th>Aktion</th>
          </tr>
        </thead>
        <tbody id="cases-body">
          <tr>
            <td colspan="7" class="text-center">Daten werden geladen...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let currentUser = null;

    async function init() {
      try {
        const res = await fetch('/api/me');
        if (res.status === 401) {
          window.location.href = '/';
          return;
        }
        currentUser = await res.json();
        document.getElementById('user-name').textContent = currentUser.displayName;

        if (currentUser.isAdmin) {
          document.getElementById('admin-link-users').style.display = 'inline-block';
          document.getElementById('admin-link-db-config').style.display = 'inline-block';
        }

        if ((currentUser.permissions || []).includes('manage_catalog')) {
          document.getElementById('admin-link-catalog').style.display = 'inline-block';
          document.getElementById('admin-link-insurance-catalog').style.display = 'inline-block';
          document.getElementById('admin-link-cash-desk-catalog').style.display = 'inline-block';
        }

        loadCases('own');
      } catch (err) {
        console.error("Could not fetch user info", err);
      }
    }

    async function loadCases(scope) {
      try {
        // Update active button
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        const btn = document.querySelector(`.filter-btn[data-scope="${scope}"]`);
        if (btn) btn.classList.add('active');

        const res = await fetch(`/api/damage-cases?scope=${scope}`);
        if (!res.ok) throw new Error("Failed to load cases");
        const data = await res.json();

        // Show/hide filter buttons based on response
        if (data.canViewAll) {
          document.getElementById('filter-dept').style.display = 'inline-block';
          document.getElementById('filter-all').style.display = 'inline-block';
        }
        if (data.canCreate) {
          document.getElementById('create-case-btn').style.display = 'inline-block';
        }

        renderCases(data.items);
      } catch (err) {
        console.error(err);
        document.getElementById('cases-body').innerHTML = '<tr><td colspan="7" class="text-center" style="color: red;">Fehler beim Laden der Fälle</td></tr>';
      }
    }

    function getStatusClass(status) {
      const s = (status || '').toLowerCase();
      if (s.includes('neu')) return 'status-neu';
      if (s.includes('abgeschlossen')) return 'status-abgeschlossen';
      return 'status-bearbeitung';
    }

    function renderCases(cases) {
      const tbody = document.getElementById('cases-body');
      tbody.innerHTML = '';

      if (!cases || cases.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center">Keine Fälle gefunden.</td></tr>';
        return;
      }

      cases.forEach(c => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
                    <td><strong>${c.caseNumber || 'Neu'}</strong></td>
                    <td>${c.subject}</td>
                    <td>${c.dienststelle || '-'}</td>
                    <td>${c.createdBy}</td>
                    <td>${c.createdAt ? new Date(c.createdAt).toLocaleDateString() : '-'}</td>
                    <td><span class="status-badge ${getStatusClass(c.status)}">${c.status}</span></td>
                    <td>
                        <a href="/create-damage-case?id=${c.id}" class="btn btn-secondary" style="font-size: 0.8rem; padding: 0.25rem 0.5rem;">Ansehen / Bearbeiten</a>
                    </td>
                `;
        tbody.appendChild(tr);
      });
    }

    document.getElementById('scope-filters').addEventListener('click', (e) => {
      if (e.target.classList.contains('filter-btn')) {
        loadCases(e.target.dataset.scope);
      }
    });

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>

</html>
