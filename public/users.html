<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SaS3 - Benutzerverwaltung | LBM Rheinland-Pfalz</title>
  <link rel="stylesheet" href="src/lbm.css">
  <style>
    .users-table {
      width: 100%;
      border-collapse: collapse;
    }

    .users-table th,
    .users-table td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid var(--lbm-gray-light);
    }

    .users-table th {
      font-weight: bold;
      color: var(--lbm-text);
    }

    .role-badge {
      background: var(--lbm-gray-light);
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-size: 0.85rem;
      display: inline-block;
      margin: 0.1rem;
      border: 1px solid var(--lbm-gray);
    }
  </style>
</head>

<body>
  <header>
    <div class="logo-container">
      <img src="src/lbm.png" alt="LBM Logo">
      <span class="header-title">SaS3 - Benutzerverwaltung</span>
    </div>
    <div class="user-menu">
      <a href="/overview" class="btn btn-secondary">Zurück zur Übersicht</a>
      <a href="/logout" class="logout-btn">Abmelden</a>
    </div>
  </header>

  <div class="container">
    <div class="flex justify-between align-center mb-2">
      <h1>Benutzerverwaltung</h1>
    </div>

    <div class="card">
      <div id="loading" class="text-center">Lade Benutzerdaten...</div>
      <div id="error-message" class="text-center" style="color: #E30613; display: none;"></div>

      <div style="overflow-x: auto;">
        <table class="users-table" id="users-table" style="display: none;">
          <thead>
            <tr>
              <th>ID (AD)</th>
              <th>Name</th>
              <th>Dienststelle</th>
              <th>E-Mail</th>
              <th>Rollen</th>
            </tr>
          </thead>
          <tbody id="users-body">
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    async function loadUsers() {
      try {
        const res = await fetch('/api/users');
        if (!res.ok) throw new Error('Netzwerkfehler');
        const users = await res.json();

        const table = document.getElementById('users-table');
        const tbody = document.getElementById('users-body');

        users.forEach(u => {
          const rolesHtml = (u.roles || []).map(r => `<span class="role-badge">${r}</span>`).join('') || '-';

          const tr = document.createElement('tr');
          tr.innerHTML = `
                        <td>${u.BENID || ''}</td>
                        <td>${u.BENVORNAME || ''} ${u.BENNACHNAME || ''}</td>
                        <td>${u.BENDIENSTSTELLE || '-'}</td>
                        <td>${u.BENMAIL || '-'}</td>
                        <td>${rolesHtml}</td>
                    `;
          tbody.appendChild(tr);
        });

        document.getElementById('loading').style.display = 'none';
        table.style.display = 'table';
      } catch (err) {
        document.getElementById('loading').style.display = 'none';
        const el = document.getElementById('error-message');
        el.textContent = 'Fehler beim Laden: ' + err.message;
        el.style.display = 'block';
      }
    }

    document.addEventListener('DOMContentLoaded', loadUsers);
  </script>
</body>

</html>
