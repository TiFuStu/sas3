          </div>
        </div>

      <nav class="navbar navbar-expand navbar-light bg-secondary" id="nav-logo">

        </div>
      </div>
    </header>
    <main role="main" class="page-section">
      <div class="container">
        <h1>Alle Benutzer</h1>
        <div id="loading">Lade Benutzerdaten...</div>
        <div id="error-message" class="error"></div>
        <table id="users-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Vorname</th>
              <th>Nachname</th>
              <th>Kürzel</th>
              <th>E-Mail</th>
              <th>Rollen</th>
              <th>Berechtigungen</th>
            </tr>
          </thead>
          <tbody id="users-body">
            <!-- User rows will be inserted here -->
          </tbody>
        </table>
      </div> 
    </main>
    <script>
      function formatList(values, fallback) {
        if (!Array.isArray(values) || values.length === 0) {
          return fallback;
        }

        return values.join(', ');
      }

      async function loadUsers() {
        try {
          const meResponse = await fetch('/api/me');
           if (meResponse.status === 401) {
             window.location.href = '/';
             return;
          }
           
          const response = await fetch('/api/users');
          if (!response.ok) {
            throw new Error('Netzwerkfehler beim Laden der Benutzer');
          }
          const users = await response.json();
          
          const tbody = document.getElementById('users-body');
          const table = document.getElementById('users-table');
          const loading = document.getElementById('loading');
          
          tbody.innerHTML = '';
          
          users.forEach(user => {
            const tr = document.createElement('tr');
            
            // Note: DB columns are uppercase based on SQL schema
            tr.innerHTML = `
              <td>${user.BENID || ''}</td>
              <td>${user.BENVORNAME || ''}</td>
              <td>${user.BENNACHNAME || ''}</td>
              <td>${user.BENKUERZEL || ''}</td>
              <td>${user.BENMAIL || ''}</td>
              <td>${formatList(user.roles, 'keine Zuordnung')}</td>
              <td>${formatList(user.permissions, 'keine Berechtigung')}</td>
            `;
            tbody.appendChild(tr);
          });
          
          loading.style.display = 'none';
          table.style.display = 'table';
          
        } catch (err) {
          console.error(err);
          document.getElementById('loading').style.display = 'none';
          document.getElementById('error-message').innerText = 'Fehler beim Laden der Benutzer: ' + err.message;
        }
      }
      
      document.addEventListener('DOMContentLoaded', loadUsers);
    </script>
  </body>
