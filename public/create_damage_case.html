<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SaS3 - Schadensfälle | LBM Rheinland-Pfalz</title>
    <link rel="stylesheet" href="src/lbm.css">
    <style>
        .split-layout {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 2rem;
            align-items: start;
        }

        @media (max-width: 900px) {
            .split-layout {
                grid-template-columns: 1fr;
            }
        }

        .case-list-card {
            background: var(--lbm-white);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            display: flex;
            flex-direction: column;
            max-height: 80vh;
        }

        .case-list-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--lbm-gray-light);
        }

        .case-list-body {
            overflow-y: auto;
            flex: 1;
        }

        .case-item {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--lbm-gray-light);
            cursor: pointer;
            transition: var(--transition);
        }

        .case-item:hover {
            background-color: #fcfcfc;
        }

        .case-item.active {
            background-color: rgba(0, 74, 143, 0.05);
            border-left: 4px solid var(--lbm-blue);
        }

        .case-item-title {
            font-weight: bold;
            color: var(--lbm-text);
            margin-bottom: 0.25rem;
        }

        .case-item-meta {
            font-size: 0.85rem;
            color: var(--lbm-gray-dark);
            display: flex;
            justify-content: space-between;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .form-grid .full-width {
            grid-column: 1 / -1;
        }

        .section-title {
            color: var(--lbm-blue);
            border-bottom: 2px solid var(--lbm-gray-light);
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
            margin-top: 2rem;
        }

        .status-bar {
            background: #fff3cd;
            color: #856404;
            padding: 1rem;
            border-radius: var(--border-radius);
            margin-bottom: 1.5rem;
            display: none;
            font-weight: bold;
        }

        .status-chips {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            font-size: 0.85rem;
        }

        .status-chip {
            background: var(--lbm-gray-light);
            padding: 0.25rem 0.75rem;
            border-radius: 99px;
            font-weight: bold;
        }

        .required-works {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            background: var(--lbm-gray-light);
            padding: 1.5rem;
            border-radius: var(--border-radius);
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <header>
        <div class="logo-container">
            <img src="src/lbm.png" alt="LBM Logo">
            <span class="header-title">SaS3 - Schadensfallverwaltung</span>
        </div>
        <div class="user-menu">
            <a href="/overview" class="btn btn-secondary">Zurück zur Übersicht</a>
            <a href="/logout" class="logout-btn">Abmelden</a>
        </div>
    </header>

    <div class="container split-layout">
        <!-- Sidebar: Case List -->
        <aside class="case-list-card">
            <div class="case-list-header flex justify-between align-center">
                <h3 style="margin: 0; font-size: 1.2rem;">Fälle</h3>
                <div class="flex gap-1 align-center">
                    <button id="refresh-list" class="btn btn-secondary" style="padding: 0.25rem 0.5rem; font-size: 0.8rem;">↻</button>
                    <select id="scope-filter" class="form-control" style="width: auto; padding: 0.25rem 0.5rem;">
                        <option value="own">Eigene</option>
                        <option value="all">Alle</option>
                    </select>
                </div>
            </div>
            <div class="case-list-body" id="case-list-body">
                <div class="text-center mt-2" style="color: var(--lbm-gray-dark);">Fälle werden geladen...</div>
            </div>
        </aside>

        <!-- Main Content: Form -->
        <main class="card" style="margin-bottom: 0;">
            <div class="flex justify-between align-center mb-2"
                style="border-bottom: 1px solid var(--lbm-gray-light); padding-bottom: 1rem;">
                <h2 style="margin: 0;">Falldetails</h2>
                <div class="flex gap-1">
                    <button class="btn btn-secondary" id="new-case">Neuer Fall</button>
                    <button class="btn btn-primary" id="save-case">Speichern</button>
                    <button class="btn btn-warning" id="forward-case" style="display: none;">An Leitung weiterleiten</button>
                    <button class="btn btn-success" id="approve-case" style="display: none;">Prüfen & Freigeben</button>
                </div>
            </div>

            <div class="status-chips">
                <div class="status-chip" id="user-chip">Lade Benutzer...</div>
                <div class="status-chip" id="scope-chip" style="background: #e2e3e5;">Lade Rechte...</div>
                <div class="status-chip" id="edit-chip" style="background: #e2e3e5; display: none;">Lade
                    Bearbeitungsstatus...</div>
            </div>

            <div class="status-bar" id="page-message" style="display: none;"></div>

            <form id="damage-case-form">
                <input type="hidden" id="case-id">

                <div class="form-grid">
                    <div>
                        <label class="form-group label">Schaden-Nr.</label>
                        <input type="text" id="case-number" class="form-control" readonly
                            placeholder="Wird automatisch vergeben">
                    </div>
                    <div>
                        <label class="form-group label">Status</label>
                        <select id="status" class="form-control" data-edit-control>
                            <option>Neu</option>
                            <option>In Bearbeitung</option>
                            <option>Warten auf Rechnung</option>
                            <option>Abgeschlossen</option>
                        </select>
                    </div>
                    <div class="full-width">
                        <label class="form-group label">Betreff / Bezeichnung <span style="color: red;">*</span></label>
                        <input type="text" id="subject" class="form-control" required data-edit-control>
                    </div>
                    <div>
                        <label class="form-group label">Datum des Schadens <span style="color: red;">*</span></label>
                        <input type="date" id="damage-date" class="form-control" required data-edit-control>
                    </div>
                    <div>
                        <label class="form-group label">Bearbeiterkennung <span style="color: red;">*</span></label>
                        <input type="text" id="assigned-to" class="form-control" required readonly data-edit-control>
                    </div>
                    <div class="full-width">
                        <label class="form-group label">Ausführliche Beschreibung</label>
                        <textarea id="description" class="form-control" rows="4" data-edit-control></textarea>
                    </div>
                </div>

                <h3 class="section-title">Ort und Beteiligte</h3>
                <div class="form-grid">
                    <div>
                        <label class="form-group label">Straße</label>
                        <input type="text" id="street" class="form-control" list="street-list" data-edit-control>
                        <datalist id="street-list"></datalist>
                    </div>
                    <div>
                        <label class="form-group label">Landkreis</label>
                        <input type="text" id="district" class="form-control" readonly data-edit-control>
                    </div>
                    <div>
                        <label class="form-group label">Abschnitt von</label>
                        <input type="text" id="section-from" class="form-control" data-edit-control>
                    </div>
                    <div>
                        <label class="form-group label">Abschnitt bis</label>
                        <input type="text" id="section-to" class="form-control" data-edit-control>
                    </div>
                    <div>
                        <label class="form-group label">Richtung / Gemarkung</label>
                        <input type="text" id="direction" class="form-control" data-edit-control>
                    </div>
                    <div>
                        <label class="form-group label">km / Station</label>
                        <input type="text" id="km-station" class="form-control" data-edit-control>
                    </div>
                    <div>
                        <label class="form-group label">Verursacher (Name) <span style="color: red;">*</span></label>
                        <input type="text" id="responsible-party" class="form-control" required data-edit-control>
                    </div>
                    <div>
                        <label class="form-group label">Verursacher (Anschrift)</label>
                        <input type="text" id="responsible-party-address" class="form-control" data-edit-control>
                    </div>
                    <div>
                        <label class="form-group label">Kfz-Kennzeichen</label>
                        <input type="text" id="plate-number" class="form-control" data-edit-control>
                    </div>
                    <div>
                        <label class="form-group label">Zulassungsstelle</label>
                        <input type="text" id="registration-office" class="form-control" readonly data-edit-control>
                    </div>
                </div>

                <h3 class="section-title">Haftung und Kosten</h3>
                <div class="form-grid">
                    <div>
                        <label class="form-group label">Versicherung</label>
                        <input type="text" id="insurance" class="form-control" data-edit-control>
                    </div>
                    <div>
                        <label class="form-group label">Rechnung an</label>
                        <input type="text" id="invoice-to" class="form-control" data-edit-control>
                    </div>
                    <div>
                        <label class="form-group label">Versicherungsschein-Nr.</label>
                        <input type="text" id="insurance-policy-number" class="form-control" data-edit-control>
                    </div>
                    <div>
                        <label class="form-group label">Schaden-Nr. (Versicherung)</label>
                        <input type="text" id="insurance-claim-number" class="form-control" data-edit-control>
                    </div>
                    <div>
                        <label class="form-group label">E-Mail Versicherung</label>
                        <input type="email" id="insurance-email" class="form-control" data-edit-control>
                    </div>
                    <div>
                        <label class="form-group label">Kasse</label>
                        <input type="text" id="cash-desk" class="form-control" data-edit-control>
                    </div>
                    <div>
                        <label class="form-group label">Sonstige Kosten (€)</label>
                        <input type="number" id="other-costs" class="form-control" step="0.01" min="0"
                            data-edit-control>
                    </div>
                    <div>
                        <label class="form-group label">Offene Forderung (€)</label>
                        <input type="number" id="open-claim-amount" class="form-control" step="0.01" min="0"
                            data-edit-control>
                    </div>
                    <div>
                        <label class="form-group label">Wiedervorlage am</label>
                        <input type="date" id="follow-up-date" class="form-control" data-edit-control>
                    </div>
                    <div class="full-width" style="margin-top: 1rem;">
                        <label class="checkbox-label">
                            <input type="checkbox" id="costs-complete" data-edit-control>
                            <strong>Kosten komplett erfasst</strong>
                        </label>
                    </div>
                </div>

                <h3 class="section-title">Erforderliche Arbeiten</h3>
                <div class="required-works">
                    <label class="checkbox-label"><input type="checkbox" class="required-work"
                            value="Verwaltungsfahrzeug instandsetzen" data-edit-control> Verwaltungsfahrzeug
                        instandsetzen</label>
                    <label class="checkbox-label"><input type="checkbox" class="required-work" value="Absperrmaßnahmen"
                            data-edit-control> Absperrmaßnahmen</label>
                    <label class="checkbox-label"><input type="checkbox" class="required-work"
                            value="Reinigung der Fahrbahn" data-edit-control> Reinigung der Fahrbahn</label>
                    <label class="checkbox-label"><input type="checkbox" class="required-work"
                            value="Beseitigung einer Ölspur" data-edit-control> Beseitigung einer Ölspur</label>
                    <label class="checkbox-label"><input type="checkbox" class="required-work" value="Aufräumarbeiten"
                            data-edit-control> Aufräumarbeiten</label>
                    <label class="checkbox-label"><input type="checkbox" class="required-work"
                            value="Ersatz von Verkehrseinrichtungen" data-edit-control> Ersatz von
                        Verkehrseinrichtungen</label>
                    <label class="checkbox-label"><input type="checkbox" class="required-work"
                            value="Reparatur von Verkehrseinrichtungen" data-edit-control> Reparatur von
                        Verkehrseinrichtungen</label>
                    <label class="checkbox-label"><input type="checkbox" class="required-work"
                            value="Instandsetzung der Grünanlage" data-edit-control> Instandsetzung der
                        Grünanlage</label>
                </div>
            </form>
        </main>
    </div>

    <!-- Integrate logic -->
    <script src="src/create-damage-case.js"></script>
</body>

</html>
